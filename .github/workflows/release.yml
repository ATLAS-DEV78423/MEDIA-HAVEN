# Release artifact preparation - NOT a publish workflow.
#
# This workflow runs only AFTER the existing CI workflow ("CI") completes
# successfully on master, so "CI first, then build" is enforced by GitHub
# rather than duplicated here. It builds the unsigned per-user NSIS installer,
# computes SHA-256 checksums and uploads artifacts for human review.
#
# It deliberately does NOT create a GitHub Release, tag, sign an artifact or
# publish anywhere. Publishing remains gated on CP-5 plus a human decision.

name: Release artifacts (unsigned, per-user)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  build-windows:
    name: Build unsigned NSIS installer + checksums
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'master' }}
    runs-on: windows-latest
    steps:
      - name: Check out the exact CI-verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Node 22 (engines requires >=22)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build, bundle and checksum (unsigned, per-user)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File `
            infrastructure\packaging\windows\build.ps1

      - name: Upload installer, checksums and notices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediahaven-windows-unsigned-${{ github.event.workflow_run.head_sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            apps/desktop/src-tauri/target/release/bundle/nsis/THIRD_PARTY_NOTICES.md
          if-no-files-found: warn

      - name: Upload SBOM if an operator generated one
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediahaven-sbom-${{ github.event.workflow_run.head_sha }}
          path: infrastructure/packaging/windows/sbom/bom.json
          if-no-files-found: warn

      - name: Reminder - no release was published
        shell: powershell
        run: Write-Host 'Artifacts only. Publishing requires CP-5 gates and a human decision.'
