[workspace]
resolver = "2"
members = [
  "crates/app-core",
  "crates/persistence",
  "crates/core",
  "crates/media-library",
  "crates/metadata",
  "crates/acquisition",
  "crates/contract",
  "crates/diagnostics",
  "crates/playback",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["MEDIA_HAVEN contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "chrono", "uuid"] }
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking", "query"] }
subtle = "2"
hex = "0.4"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
